# gh-pages dalına push edilen site içeriğini GitHub Pages'e yayınlar.
# Legacy (Jekyll) builder büyük müzik dosyalarında zaman aşımına uğradığı
# için Actions tabanlı deploy kullanılıyor. Bu dosya her deploy'da
# gh-pages dalına .github/workflows/pages.yml olarak kopyalanır.
name: Deploy Pages

on:
  push:
    branches: [gh-pages]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
