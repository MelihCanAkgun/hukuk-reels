<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="/hukuk-reels/">
  <meta charset="UTF-8">
  <!-- Güvenlik: yalnızca kendi dosyalarımız ve iki kişilik sunucu. Sunucu adresi
       değişirse (SOCIAL_API_URL) buradaki connect-src de güncellenmeli. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://hukuk-games-social.hukuk-games-social.workers.dev wss://hukuk-games-social.hukuk-games-social.workers.dev https://fonts.gstatic.com; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- ── PWA Temel ── -->
  <meta name="theme-color" content="#170B12">
  <meta name="description" content="Çevrimdışı hukuk eğitim uygulaması">
  <link rel="manifest" href="manifest.json">

  <!-- ── iOS Safari PWA (Add to Home Screen) ── -->

  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- iOS Safari ikon boyutları -->

  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">

  <!-- iOS Splash Screen'ler (en yaygın cihazlar) -->
  <!-- iPhone 15 Pro Max / 14 Pro Max (430x932) -->
  <link rel="apple-touch-startup-image"
        href="icons/splash-1290x2796.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone 15 / 14 (390x844) -->
  <link rel="apple-touch-startup-image"
        href="icons/splash-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone SE 3 (375x667) -->
  <link rel="apple-touch-startup-image"
        href="icons/splash-750x1334.png"
        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPad Air / 10.9" (820x1180) -->

        href="icons/splash-1640x2360.png"
        media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2)">

  <!-- ── Android Chrome PWA ── -->
  <meta name="application-name" content="Hukuk Reels">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A0A14">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">

  <meta name="app-build" content="5d6286836d2d766f">
  <title>Hukuk Reels</title>

  <style>
    /* Yükleme ekranı */
    body {
      margin: 0;
      padding: 0;
      background-color: #1A0A14;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      /* iOS: sürükleme/basılı tutma sırasında büyüteç, callout ve metin
         seçimi çıkmasın (Block Blast sürüklemeleri için önemli) */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      /* iOS/Safari: sayfa kenarlarında lastik zıplama olmasın */
      overscroll-behavior: none;
      /* iOS safe area desteği */
      box-sizing: border-box;
    }
    #loading {
      /* Keep startup content outside document layout and input hit testing. */
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #FF80AB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading p {
      color: rgba(255,255,255,0.5);
      margin-top: 16px;
      font-size: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* Flutter owns the fixed body and viewport dimensions. In particular,
       do not fix/size the html root: iOS measures it for canvas coordinates. */
    html {
      margin: 0;
      padding: 0;
      overscroll-behavior: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Hukuk Reels yükleniyor...</p>
  </div>

  <link rel="stylesheet" href="update.css">

  <script src="avatar.js"></script>
  <script src="social.js"></script>
  <script src="battle.js"></script>
  <script src="notes/notes.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
