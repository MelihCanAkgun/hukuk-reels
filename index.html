<!DOCTYPE html>
<html lang="tr">
<head>
  <base href="/hukuk-reels/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- ── PWA Temel ── -->
  <meta name="theme-color" content="#170B12">
  <meta name="description" content="Çevrimdışı hukuk eğitim uygulaması">
  <link rel="manifest" href="manifest.json">

  <!-- ── iOS Safari PWA (Add to Home Screen) ── -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Hukuk Reels">

  <!-- iOS Safari ikon boyutları -->
  <link rel="apple-touch-icon" href="icons/icon-180x180.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152x152.png">
  <link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167x167.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180x180.png">

  <!-- iOS Splash Screen'ler (en yaygın cihazlar) -->
  <!-- iPhone 15 Pro Max / 14 Pro Max (430x932) -->
  <link rel="apple-touch-startup-image"
        href="icons/splash-1290x2796.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone 15 / 14 (390x844) -->
  <link rel="apple-touch-startup-image"
        href="icons/splash-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
  <!-- iPhone SE 3 (375x667) -->
  <link rel="apple-touch-startup-image"
        href="icons/splash-750x1334.png"
        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
  <!-- iPad Air / 10.9" (820x1180) -->
  <link rel="apple-touch-startup-image"
        href="icons/splash-1640x2360.png"
        media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2)">

  <!-- ── Android Chrome PWA ── -->
  <meta name="application-name" content="Hukuk Reels">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1A0A14">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon.png">

  <title>Hukuk Reels</title>

  <style>
    /* Yükleme ekranı */
    body {
      margin: 0;
      padding: 0;
      background-color: #1A0A14;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      /* iOS: sürükleme/basılı tutma sırasında büyüteç, callout ve metin
         seçimi çıkmasın (Block Blast sürüklemeleri için önemli) */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      /* iOS/Safari: sayfa kenarlarında lastik zıplama olmasın */
      overscroll-behavior: none;
      /* iOS safe area desteği */
      box-sizing: border-box;
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #FF80AB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #loading p {
      color: rgba(255,255,255,0.5);
      margin-top: 16px;
      font-size: 14px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* iOS rubber-band scroll engeli */
    html, body {
      position: fixed;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Hukuk Reels yükleniyor...</p>
  </div>

  <script src="audio.js"></script>
  <script>
    // ── Android Chrome PWA Install Prompt ──
    let _deferredInstallPrompt = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      _deferredInstallPrompt = e;
      console.log('[PWA] Install prompt yakalandı');
    });

    // Flutter'dan çağrılabilir: Chrome'un native install dialog'unu göster
    async function triggerInstallPrompt() {
      if (!_deferredInstallPrompt) return false;
      _deferredInstallPrompt.prompt();
      const result = await _deferredInstallPrompt.userChoice;
      _deferredInstallPrompt = null;
      return result.outcome === 'accepted';
    }

    // PWA modunda mı çalışıyor kontrolü
    function isRunningStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches
          || window.navigator.standalone === true;
    }

    window.addEventListener('appinstalled', function() {
      console.log('[PWA] Uygulama yüklendi!');
      _deferredInstallPrompt = null;
    });

    // Updates wait for the player: never reload an active game automatically.
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('loading')?.remove();
      if (!('serviceWorker' in navigator)) return;
      let applyingUpdate = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (applyingUpdate) window.location.reload();
      });
      navigator.serviceWorker.register('flutter_service_worker.js?v=893095880') /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */.then(function (reg) {
        function offerUpdate() {
          if (!reg.waiting || !navigator.serviceWorker.controller || document.getElementById('update-app')) return;
          const button = document.createElement('button');
          button.id = 'update-app';
          button.textContent = 'Yeni sürüm hazır · Yenile';
          button.style.cssText = 'position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:99999;padding:14px 20px;border:0;border-radius:24px;background:#ffe26a;color:#182b50;font:600 14px -apple-system,sans-serif';
          button.onclick = function () {
            if (!reg.waiting) return;
            applyingUpdate = true;
            reg.waiting.postMessage('skipWaiting');
          };
          document.body.appendChild(button);
        }
        offerUpdate();
        reg.addEventListener('updatefound', function () {
          const worker = reg.installing;
          if (worker) worker.addEventListener('statechange', function () {
            if (worker.state === 'installed') offerUpdate();
          });
        });
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) reg.update().catch(function () {});
        });
      }).catch(function (error) { console.warn('[PWA]', error); });
    });
  </script>

  <script src="social.js"></script>
  <script src="battle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
